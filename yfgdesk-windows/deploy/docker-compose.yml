# YFGDESK v2 — Production deployment
#
# Usage:
#   1. cp .env.example .env && edit values
#   2. docker compose up -d
#
# Services:
#   - yfgdesk-server  : REST + WebSocket signaling on :8080 (internal)
#   - turn             : coturn on :3478 + relay ports 49160-49200
#   - caddy            : TLS-terminating reverse proxy on :80/:443

services:
  init-data-permissions:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 1654:1654 /data"]
    volumes:
      - yfgdesk-data:/data
    restart: "no"

  yfgdesk-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      YFGDESK_DB: Data Source=/data/yfgdesk.db
      YFGDESK_TURN_URLS: ${TURN_URLS:?Set TURN_URLS in .env}
      YFGDESK_TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}
      YFGDESK_TURN_REALM: ${TURN_REALM:?Set TURN_REALM in .env}
    volumes:
      - yfgdesk-data:/data
    depends_on:
      init-data-permissions:
        condition: service_completed_successfully
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    expose: ["8080"]

  turn:
    image: coturn/coturn:4.6.3-alpine
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}
      - --realm=${TURN_REALM:?Set TURN_REALM in .env}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --user-quota=8
      - --total-quota=500
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.0.2.0-192.0.2.255
      - --denied-peer-ip=192.88.99.0-192.88.99.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=198.51.100.0-198.51.100.255
      - --denied-peer-ip=203.0.113.0-203.0.113.255
      - --denied-peer-ip=240.0.0.0-255.255.255.255
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks: [public]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      YFGDESK_DOMAIN: ${YFGDESK_DOMAIN:?Set YFGDESK_DOMAIN in .env}
    depends_on:
      - yfgdesk-server
    networks: [public, private]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  private:
    internal: true
  public:

volumes:
  yfgdesk-data:
  caddy-data:
  caddy-config:
