<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="YFGDESK mark">
    <!-- YFGDESK brand mark: dark navy disc + teal "Y" stroke + signal arc -->
    <defs>
        <linearGradient id="disc" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141E33"/>
            <stop offset="100%" stop-color="#0A1220"/>
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#disc)" stroke="#2CE2CA" stroke-width="1.5"/>
    <!-- stylized Y -->
    <path d="M20 18 L32 34 L44 18" stroke="#2CE2CA" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <line x1="32" y1="34" x2="32" y2="48" stroke="#2CE2CA" stroke-width="3.5" stroke-linecap="round"/>
    <!-- signal arcs -->
    <path d="M14 44 Q24 50 34 44" stroke="#2CE2CA" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M18 50 Q24 54 30 50" stroke="#2CE2CA" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>
